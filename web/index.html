<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TigerGraph Agentic Fraud Investigator | HHGOA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/dist/vis-network.min.js"></script>
    <style>
        :root {
            --bg-base: #0B0F19;
            --bg-card: #111827;
            --bg-card-hover: #1F2937;
            --border-color: #374151;
            --text-primary: #F9FAFB;
            --text-secondary: #9CA3AF;
            --text-muted: #6B7280;
            --tiger-orange: #FF6A00;
            --tiger-accent: #FF8800;
            --accent-blue: #3B82F6;
            --accent-green: #10B981;
            --accent-red: #EF4444;
            --accent-purple: #8B5CF6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; }

        /* Top Header */
        header {
            background: linear-gradient(180deg, #161F30 0%, #111827 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand-box { display: flex; align-items: center; gap: 14px; }
        .tiger-logo-badge {
            background: linear-gradient(135deg, var(--tiger-orange), #FF4500);
            width: 42px; height: 42px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 20px; color: #fff;
            box-shadow: 0 4px 14px rgba(255, 106, 0, 0.4);
        }
        .header-title h1 { font-size: 18px; font-weight: 700; color: #fff; }
        .header-title p { font-size: 13px; color: var(--text-secondary); }
        .header-badges { display: flex; gap: 10px; }
        .badge {
            font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .badge-live { background: rgba(16, 185, 129, 0.15); color: #34D399; border: 1px solid rgba(52, 211, 153, 0.3); }
        .badge-tg { background: rgba(255, 106, 0, 0.15); color: #FFA07A; border: 1px solid rgba(255, 106, 0, 0.3); }

        /* Main Workspace Layout */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            height: calc(100vh - 75px);
        }

        /* Sidebar - Case List */
        .sidebar {
            width: 340px;
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-header h2 { font-size: 14px; font-weight: 600; color: var(--text-secondary); }
        .case-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .case-card {
            background: #182234;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .case-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-blue);
        }
        .case-card.active {
            background: #1E2D48;
            border-color: var(--tiger-orange);
            box-shadow: 0 0 12px rgba(255, 106, 0, 0.25);
        }
        .case-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .case-card-id { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; }
        .badge-verdict { font-size: 10px; padding: 2px 8px; border-radius: 12px; font-weight: 700; }
        .badge-fraud { background: rgba(239, 68, 68, 0.2); color: #F87171; border: 1px solid #EF4444; }
        .badge-legit { background: rgba(16, 185, 129, 0.2); color: #4ADE80; border: 1px solid #10B981; }
        .case-card-sub { font-size: 12px; color: var(--text-secondary); display: flex; justify-content: space-between; }

        /* Main Investigation View */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            background: var(--bg-base);
        }

        /* Top Summary Banner */
        .case-hero {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hero-left h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 12px; }
        .hero-left p { font-size: 14px; color: var(--text-secondary); }
        .hero-stats { display: flex; gap: 24px; }
        .stat-box { text-align: right; }
        .stat-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; }
        .stat-value { font-size: 20px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
        .stat-val-fraud { color: var(--accent-red); }
        .stat-val-legit { color: var(--accent-green); }

        /* Grid Layout */
        .grid-2col {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .panel-title { font-size: 15px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 8px; }

        /* Graph Canvas */
        #graph-network {
            height: 320px;
            background: #090D16;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        /* Next Best Actions */
        .action-card {
            background: #182234;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 10px;
            border-left: 4px solid var(--accent-blue);
        }
        .action-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .action-name { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #93C5FD; }
        .action-route { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #2563EB; font-weight: 700; }
        .action-reason { font-size: 13px; color: var(--text-secondary); line-height: 1.4; }

        /* Evidence Timeline */
        .evidence-item {
            background: #151D2C;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 10px;
            border-left: 4px solid var(--tiger-orange);
        }
        .evidence-claim { font-size: 13px; color: var(--text-primary); margin-bottom: 4px; font-weight: 500; }
        .evidence-meta { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

        /* SAR Narrative Box */
        .sar-box {
            background: #1A1829;
            border: 1px solid #4C1D95;
            border-radius: 8px;
            padding: 16px;
            margin-top: 14px;
        }
        .sar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .sar-title { font-size: 13px; font-weight: 700; color: #C4B5FD; text-transform: uppercase; letter-spacing: 0.5px; }
        .sar-text { font-size: 13px; color: #E5E7EB; line-height: 1.6; }

        /* Precedent Memory */
        .memory-tag {
            display: inline-block;
            background: rgba(139, 92, 246, 0.2);
            color: #C4B5FD;
            border: 1px solid #7C3AED;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 6px;
            margin-right: 6px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-box">
            <div class="tiger-logo-badge">TG</div>
            <div class="header-title">
                <h1>TigerGraph Agentic Fraud Investigator</h1>
                <p>Hacker House Goa &bull; Next-Best Action & Case Progression Engine</p>
            </div>
        </div>
        <div class="header-badges">
            <span class="badge badge-live">Live Benchmark (20 Cases)</span>
            <span class="badge badge-tg">TigerGraph Savanna GraphRAG</span>
        </div>
    </header>

    <div class="workspace">
        <!-- Sidebar with 20 Cases -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>BENCHMARK EXAM CASES</h2>
                <span style="font-size: 12px; color: var(--text-muted);">20 Cases Loaded</span>
            </div>
            <div class="case-list" id="case-list-container">
                <!-- Injected via JavaScript -->
            </div>
        </div>

        <!-- Main Investigation View -->
        <div class="main-content" id="main-content-view">
            <!-- Dynamic Case View Injected Here -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
